[project]
name = "meridian-agent"
version = "0.1.0"
description = "Agent runtime: deterministic routing, semantic cache, grounded retrieval, governed orchestration."
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "pydantic>=2.9",
  "psycopg[binary,pool]>=3.2",
  "httpx>=0.27",
  "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3",
  "pytest-asyncio>=0.24",
  "ruff>=0.7",
  "mypy>=1.13",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["meridian_agent*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
# E,F pycodestyle/pyflakes · I import order · B bugbear · UP pyupgrade
# S bandit: this service is public, so security lint is not optional
select = ["E", "F", "I", "B", "UP", "S", "RUF"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]  # assert is the point of a test

[tool.mypy]
python_version = "3.11"
strict = true
warn_unreachable = true
# Third-party stubs are inconsistent; our own code is strict regardless.
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
# A test that needs a database is marked; the offline suite must stay runnable
# with no credentials at all (IMP-04).
markers = [
  "integration: requires a live Postgres (skipped when DATABASE_URL is unset)",
]
