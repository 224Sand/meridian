[project]
name = "meridian-agent"
version = "0.1.0"
description = "Agent runtime: deterministic routing, semantic cache, grounded retrieval, governed orchestration."
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "pydantic>=2.9",
  "psycopg[binary,pool]>=3.2",
  "httpx>=0.27",
  "python-dotenv>=1.0",
  # Serving runtime for models trained offline (ADR-0009). ~50MB, versus the
  # 2-3GB the training frameworks would cost. This is the whole reason that
  # decision exists.
  "onnxruntime>=1.20",
  "numpy>=2.1",
  # The Rust tokenizer core on its own, ~3MB. `transformers` would pull torch
  # and cost ~1GB to do the same job at inference time (ADR-0009).
  "tokenizers>=0.20",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3",
  "pytest-asyncio>=0.24",
  "ruff>=0.7",
  "mypy>=1.13",
]
# Training and reference-implementation dependencies. NOT runtime dependencies
# (ADR-0009): models are trained offline and served without their framework, and
# meridian_agent.evaluation.statistics is written against the standard library
# so the shipped code carries none of this. These exist so tests can check that
# hand-written statistics agree with the reference implementations.
ml = [
  "scipy>=1.14",
  "scikit-learn>=1.5",
  "skl2onnx>=1.17",
  # Training only. ADR-0009 keeps these out of the runtime: torch alone is
  # ~1GB installed, against the ~50MB onnxruntime costs to serve what it trains.
  "torch>=2.5",
  "transformers>=4.45",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["meridian_agent*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
# E,F pycodestyle/pyflakes · I import order · B bugbear · UP pyupgrade
# S bandit: this service is public, so security lint is not optional
select = ["E", "F", "I", "B", "UP", "S", "RUF"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
# S101: assert is the point of a test.
# S311: fixtures must be reproducible from a seed, which is exactly what a
#       CSPRNG refuses to be. No test generates a secret.
"tests/*" = ["S101", "S311"]
# S311 flags `random` as unsuitable for cryptography, which is correct and not
# what it is doing here: the seed package must produce the SAME estate and the
# SAME incident from the same seed, which is exactly what a seeded Mersenne
# Twister gives and what a CSPRNG deliberately does not. Nothing in this package
# generates a secret. Scoped to seed/ so the rule still applies everywhere else.
"meridian_agent/seed/*" = ["S311"]
# Same reasoning for the evaluation package: a train/test split must be
# reproducible from its seed, which is precisely what a CSPRNG refuses to be.
# No secret is generated here either.
"meridian_agent/evaluation/*" = ["S311"]
# S608 flags the interpolated table name in the ANN benchmark. TABLE is a module
# constant that is never derived from input, the script is offline and not
# request-facing, and every VALUE in those statements is still parameterised.
# S311: benchmark vectors must be reproducible from a seed.
"training/benchmark_ann.py" = ["S608", "S311"]
# S311: negative sampling and shuffling must be reproducible from a seed.
"training/train_reranker.py" = ["S311"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unreachable = true
# Third-party stubs are inconsistent; our own code is strict regardless.
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
# A test that needs a database is marked; the offline suite must stay runnable
# with no credentials at all (IMP-04).
markers = [
  "integration: requires a live Postgres (skipped when DATABASE_URL is unset)",
  "ml: requires the ml extra (numpy/scipy/scikit-learn), which is training-time only",
]
