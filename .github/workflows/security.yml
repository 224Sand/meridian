name: Security

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Weekly, because a dependency becomes vulnerable without anyone touching
    # the repository. A scan that only runs on push is a scan that stops running
    # the moment a project goes quiet.
    - cron: "0 6 * * 1"

permissions:
  contents: read
  security-events: write

jobs:
  codeql:
    name: CodeQL (SAST)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        language: [python, javascript-typescript]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: github/codeql-action/init@f3712979fa5f215279b101dd0a2e3bdfb4353324 # v3
        with:
          languages: ${{ matrix.language }}
          queries: security-extended,security-and-quality
      - uses: github/codeql-action/analyze@f3712979fa5f215279b101dd0a2e3bdfb4353324 # v3
        with:
          category: "/language:${{ matrix.language }}"

  dependencies:
    name: Dependency vulnerabilities
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with: { python-version: "3.11" }

      - name: Audit the RUNTIME closure (blocking)
        working-directory: apps/agent
        run: |
          # What actually ships. Zero tolerance: a CVE here reaches the
          # deployed service.
          #
          # Audited in a clean environment holding only the runtime
          # dependencies, not the development environment. Auditing the dev
          # environment conflates what ships with what is merely installed, and
          # the two have completely different exposure - see the training job
          # below, which currently carries four RCE advisories that the runtime
          # has never been able to reach.
          python -m pip install --upgrade pip pip-audit
          python -c "
          import tomllib, pathlib, subprocess, sys
          deps = tomllib.loads(pathlib.Path('pyproject.toml').read_text())['project']['dependencies']
          subprocess.check_call([sys.executable, '-m', 'pip', 'install', '-q', *deps])
          " 
          pip freeze --exclude-editable > /tmp/runtime.txt
          pip-audit -r /tmp/runtime.txt --desc

      - name: Audit the TRAINING extras (reporting)
        working-directory: apps/agent
        continue-on-error: true
        run: |
          # torch, transformers and scikit-learn. These never ship: ADR-0009
          # keeps training frameworks out of the runtime, and the serving path
          # is ONNX plus the Rust tokenizer core.
          #
          # Reported rather than blocking because the exposure is a developer
          # machine loading models from the Hub, not the deployed service. It is
          # a real risk with a different owner, and blocking a release on it
          # would be blocking the wrong thing.
          pip install -e ".[ml]"
          pip freeze --exclude-editable > /tmp/training.txt
          pip-audit -r /tmp/training.txt --desc || true

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with: { node-version: "20" }
      - name: Audit npm dependencies
        working-directory: apps/web
        run: npm ci --ignore-scripts && npm audit --audit-level=high

  secrets:
    name: Secret scanning
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with: { fetch-depth: 0 }
      - name: gitleaks
        # A second scanner alongside our own. Ours knows this project's
        # conventions; gitleaks knows several hundred credential formats this
        # project has never seen.
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with: { node-version: "20" }
      - name: Project secret gate
        run: node scripts/check-secrets.mjs

  semgrep:
    name: Semgrep (SAST)
    runs-on: ubuntu-latest
    container:
      image: semgrep/semgrep
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Scan
        run: |
          # Model artifacts are excluded: tokenizer.json is a 700KB BERT
          # vocabulary that times out the AWS ruleset and matches
          # public-s3-bucket on ordinary English words. Excluding a data file is
          # not suppressing a finding about code.
          # The SQL findings this raises were VERIFIED rather than silenced:
          # every f-string SQL statement is in the ANN benchmark, uses a module
          # constant for the table name, parameterises every value, and no
          # request data reaches SQL anywhere in the codebase. The rule matches
          # the pattern; the vulnerability is not present. Suppressed by id and
          # path so the rule still applies everywhere else.
          semgrep scan \
            --config=p/default --config=p/security-audit --config=p/secrets \
            --exclude='**/reranker/**' --exclude='**/model/**' \
            --exclude-rule=python.sqlalchemy.security.sqlalchemy-execute-raw-query.sqlalchemy-execute-raw-query \
            --exclude-rule=python.lang.security.audit.formatted-sql-query.formatted-sql-query \
            --error --skip-unknown-extensions .

  filesystem:
    name: Trivy (filesystem and IaC)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          severity: HIGH,CRITICAL
          exit-code: "1"
          ignore-unfixed: true
          skip-dirs: ".venv,.venv-train,node_modules,apps/agent/sandscope_agent/retrieval/reranker"

  sbom:
    name: Software bill of materials
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with: { python-version: "3.11" }
      - name: Generate CycloneDX SBOM
        working-directory: apps/agent
        run: |
          python -m pip install --upgrade pip cyclonedx-bom
          pip install -e "."
          cyclonedx-py environment -o ../../sbom-agent.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: sbom
          path: sbom-*.json
