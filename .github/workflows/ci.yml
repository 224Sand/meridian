name: CI

on:
  push:
    branches: [main, "sprint/**", "feat/**", "fix/**"]
  pull_request:
    branches: [main]

# A red pipeline blocks merge. There is no override (charter section 8).
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  governance:
    name: Governance gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: "20"
      - name: Validate product configuration (FR-001)
        run: node scripts/check-config.mjs
      - name: Validate PDLC artifacts and traceability (AC-002)
        run: node scripts/check-docs.mjs
      - name: README check (stated figures match the derived record)
        run: node scripts/check-readme.mjs
      - name: Traceability check (no requirement claims more than it can show)
        run: node scripts/check-traceability.mjs
      - name: Workflow shell check (guards D-011)
        run: node scripts/check-workflow-shell.mjs
      - name: Secret scan (Definition of Done item 4)
        run: node scripts/check-secrets.mjs

  agent:
    name: Agent runtime
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/agent

    # Integration tests run against a real Postgres with pgvector. This is what
    # keeps the schema verified on every push without anyone owning a managed
    # database (IMP-04).
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: sandscope
          POSTGRES_PASSWORD: sandscope
          POSTGRES_DB: sandscope_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U sandscope"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.11"
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,ml]"

      - name: Lint
        run: ruff check .

      - name: Format check
        run: ruff format --check .

      - name: Type check
        run: mypy sandscope_agent

      - name: Offline test suite
        # Must pass with no DATABASE_URL at all: the offline suite is what runs
        # on a contributor machine with no credentials.
        run: pytest -q -m "not integration"

      - name: Verify hand-written statistics against the reference libraries
        # Kept as its own step so a disagreement with scikit-learn or scipy
        # reads as exactly that, rather than as one failure among many.
        run: pytest -q tests/test_statistics.py

      - name: Integration test suite
        env:
          DATABASE_URL: postgresql://sandscope:sandscope@localhost:5432/sandscope_test
        run: pytest -q -m integration

      - name: Smoke test the assembled system
        # DoD item 7: demonstrable, not described. Written at Sprint 0 and
        # enforced zero times until Sprint 5, by which point the first real
        # execution had found three defects in ten minutes.
        run: python scripts/smoke.py

      - name: Evaluation suites
        # golden/core blocks. golden/probe warns and never blocks: a probe suite
        # that could fail the build would be tuned until it stopped complaining,
        # and the limitations it records would vanish without being fixed.
        run: python training/run_evaluation.py

      - name: Upload evaluation report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: evaluation-report
          path: apps/agent/reports/evaluation.json
