name: CI

on:
  push:
    branches: [main, "sprint/**", "feat/**", "fix/**"]
  pull_request:
    branches: [main]

# A red pipeline blocks merge. There is no override (charter section 8).
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  governance:
    name: Governance gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "20"
      - name: Validate product configuration (FR-001)
        run: node scripts/check-config.mjs
      - name: Validate PDLC artifacts and traceability (AC-002)
        run: node scripts/check-docs.mjs
      - name: Sprint check (no sprint number precedes its plan)
        run: node scripts/check-sprints.mjs
      - name: README check (stated figures match the derived record)
        run: node scripts/check-readme.mjs
      - name: Traceability check (no requirement claims more than it can show)
        run: node scripts/check-traceability.mjs
      - name: Workflow shell check (guards D-011)
        run: node scripts/check-workflow-shell.mjs
      - name: Secret scan (Definition of Done item 4)
        run: node scripts/check-secrets.mjs

  # The web application was never built in CI until Sprint 8.
  #
  # Its absence was invisible because every other job passed: a Dependabot PR
  # taking Next from 15 to 16 reported 10/10 green while the production build
  # failed on all seven pages. Nothing in the pipeline had ever run `next build`.
  # A green tick that exercises none of the code under change is worse than no
  # tick, because it is read as evidence. Logged as D-018.
  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history: the prebuild derives the project's first commit from
          # the root commit, and a depth-1 clone reports "1 commits".
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Install
        run: npm ci
      # No lint step: `next lint` is deprecated and prompts interactively for an
      # ESLint configuration, which would hang the runner rather than fail it.
      # A step that can hang is worse than an absent one. Type checking and the
      # build are what actually gate this app; ESLint setup is tracked separately.
      - name: Type check
        run: npx tsc --noEmit
      - name: Build
        run: npm run build
      - name: Audit dependencies
        run: npm audit --audit-level=high

  agent:
    name: Agent runtime
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/agent

    # Integration tests run against a real Postgres with pgvector. This is what
    # keeps the schema verified on every push without anyone owning a managed
    # database (IMP-04).
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: sandscope
          POSTGRES_PASSWORD: sandscope
          POSTGRES_DB: sandscope_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U sandscope"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,ml]"

      - name: Lint
        run: ruff check .

      - name: Format check
        run: ruff format --check .

      - name: Type check
        run: mypy sandscope_agent

      - name: Offline test suite
        # Must pass with no DATABASE_URL at all: the offline suite is what runs
        # on a contributor machine with no credentials.
        run: pytest -q -m "not integration"

      - name: Verify hand-written statistics against the reference libraries
        # Kept as its own step so a disagreement with scikit-learn or scipy
        # reads as exactly that, rather than as one failure among many.
        run: pytest -q tests/test_statistics.py

      - name: Integration test suite
        env:
          DATABASE_URL: postgresql://sandscope:sandscope@localhost:5432/sandscope_test
        run: pytest -q -m integration

      - name: Smoke test the assembled system
        # DoD item 7: demonstrable, not described. Written at Sprint 0 and
        # enforced zero times until Sprint 5, by which point the first real
        # execution had found three defects in ten minutes.
        run: python scripts/smoke.py

      - name: Evaluation suites
        # golden/core blocks. golden/probe warns and never blocks: a probe suite
        # that could fail the build would be tuned until it stopped complaining,
        # and the limitations it records would vanish without being fixed.
        run: python training/run_evaluation.py

      - name: Upload evaluation report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: evaluation-report
          path: apps/agent/reports/evaluation.json
