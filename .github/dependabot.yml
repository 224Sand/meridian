version: 2
updates:
  - package-ecosystem: "pip"
    directory: "/apps/agent"
    schedule: { interval: "weekly" }
    open-pull-requests-limit: 5
    labels: ["security", "dependencies"]
  - package-ecosystem: "npm"
    directory: "/apps/web"
    schedule: { interval: "weekly" }
    open-pull-requests-limit: 5
    labels: ["security", "dependencies"]
  - package-ecosystem: "npm"
    directory: "/"
    schedule: { interval: "weekly" }
    labels: ["security", "dependencies"]
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule: { interval: "weekly" }
    labels: ["security", "ci"]
